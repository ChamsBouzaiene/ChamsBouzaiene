<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Chams Bouzaiene</title>
  <desc id="desc">I build AI agents and point them at real code to find real bugs. Software engineer in Hamburg working on AI agents, developer tools and security research.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#aff5b4"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1000" height="340" rx="14"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .cmd { fill: #e6edf3; }
    .ps { fill: #7ee787; }
    .out { fill: #8b949e; }
    .dir { fill: #79c0ff; }
    .cover { fill: #010409; transform: translateX(600px); }

    .show { animation: show .35s ease-out both; }
    .t6 { animation: t6 .45s steps(6, end) both; }
    .t13 { animation: t13 .8s steps(13, end) both; }
    .cursor { animation: show .1s 4.9s both, blink 1.1s steps(1, end) 5s infinite; }

    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes t6 { from { transform: translateX(0); } to { transform: translateX(60px); } }
    @keyframes t13 { from { transform: translateX(0); } to { transform: translateX(125px); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .show, .t6, .t13, .cursor { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="#0d1117"/>
    <rect width="1000" height="340" fill="url(#dots)"/>
    <rect width="1000" height="340" fill="url(#glow)"/>

    <!-- window chrome -->
    <rect width="1000" height="40" fill="#161b22"/>
    <line x1="0" y1="40.5" x2="1000" y2="40.5" stroke="#30363d"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="6" fill="#febc2e"/>
    <circle cx="64" cy="20" r="6" fill="#28c840"/>
    <text x="500" y="25" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">chams@hamburg: ~/agents</text>

    <!-- left: intro -->
    <text x="48" y="102" class="mono ps" font-size="14">// hi, i'm</text>
    <text x="46" y="156" class="sans" font-size="46" font-weight="700" fill="url(#name)" letter-spacing="-0.5">Chams Bouzaiene</text>
    <text class="sans" font-size="19" fill="#c9d1d9">
      <tspan x="48" y="200">I build AI agents, and point them</tspan>
      <tspan x="48" y="228">at real code to find real bugs.</tspan>
    </text>

    <g class="mono" font-size="12.5">
      <rect x="48" y="258" width="92" height="28" rx="14" fill="#7ee787" fill-opacity="0.08" stroke="#7ee787" stroke-opacity="0.35"/>
      <text x="94" y="276.5" text-anchor="middle" fill="#7ee787">AI agents</text>
      <rect x="150" y="258" width="136" height="28" rx="14" fill="#79c0ff" fill-opacity="0.08" stroke="#79c0ff" stroke-opacity="0.35"/>
      <text x="218" y="276.5" text-anchor="middle" fill="#79c0ff">developer tools</text>
      <rect x="296" y="258" width="156" height="28" rx="14" fill="#ffa198" fill-opacity="0.08" stroke="#ffa198" stroke-opacity="0.35"/>
      <text x="374" y="276.5" text-anchor="middle" fill="#ffa198">security research</text>
    </g>

    <!-- right: terminal -->
    <rect x="530" y="66" width="430" height="242" rx="10" fill="#010409" stroke="#30363d"/>
    <g class="mono" font-size="14">
      <g class="show" style="animation-delay:.3s">
        <text x="556" y="102"><tspan class="ps">$</tspan><tspan class="cmd" x="573">whoami</tspan></text>
        <rect class="cover t6" x="573" y="86" width="60" height="22" style="animation-delay:.45s"/>
      </g>
      <text class="out show" x="573" y="128" style="animation-delay:1.1s">software engineer · hamburg, de</text>

      <g class="show" style="animation-delay:1.6s">
        <text x="556" y="160"><tspan class="ps">$</tspan><tspan class="cmd" x="573">ls ~/building</tspan></text>
        <rect class="cover t13" x="573" y="144" width="125" height="22" style="animation-delay:1.75s"/>
      </g>
      <text class="dir show" y="186" style="animation-delay:2.75s"><tspan x="573">dodo/</tspan><tspan x="648">ctxant/</tspan><tspan x="740">vuln-agents/</tspan></text>

      <g class="show" style="animation-delay:3.25s">
        <text x="556" y="218"><tspan class="ps">$</tspan><tspan class="cmd" x="573">cat focus.txt</tspan></text>
        <rect class="cover t13" x="573" y="202" width="125" height="22" style="animation-delay:3.4s"/>
      </g>
      <text class="out show" x="573" y="244" style="animation-delay:4.4s">agent runtimes · browser agents</text>
      <text class="out show" x="573" y="266" style="animation-delay:4.6s">llm-assisted vulnerability research</text>

      <text class="ps show" x="556" y="292" style="animation-delay:4.9s">$</text>
      <rect class="cursor" x="572" y="279" width="9" height="17" fill="#7ee787"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="14" fill="none" stroke="#30363d"/>
</svg>
